name: 🚀 Auto Update M3U Playlist

on:
  schedule:
    # প্রতি ২৪ ঘণ্টায় একবার রান করবে (প্রতিদিন বাংলাদেশ সময় সকাল ৬:০০টায় / UTC 00:00)
    - cron: '0 0 * * *'
  workflow_dispatch: # গিটহাব থেকে ম্যানুয়ালি রান করার বাটন

concurrency:
  group: update-m3u-${{ github.ref }}
  cancel-in-progress: true

jobs:
  update-m3u:
    name: Run Enterprise Stream Checker
    runs-on: ubuntu-latest
    timeout-minutes: 90

    permissions:
      contents: write
      actions: write # প্রিভিউস অ্যাকশন রান ডিলেট করার জন্য পারমিশন

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 🐍 Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: ⚡ Install FFmpeg & Python Dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg
          python -m pip install --upgrade pip
          pip install aiohttp requests

      - name: 🔍 Run M3U Stream Checker
        env:
          # এখানে GitHub Secret থেকে আপনার প্রাইভেট Gist URL ইনজেক্ট হচ্ছে
          GIST_SOURCES_URL: ${{ secrets.GIST_SOURCES_URL }}
        run: |
          python auto_m3u.py

      - name: 📊 Generate Summary Report
        if: always()
        run: |
          echo "### 📺 M3U Health Check Summary" >> $GITHUB_STEP_SUMMARY
          if [ -f "working.m3u" ]; then
            TOTAL_CHANNELS=$(grep -c "^#EXTINF" working.m3u || echo 0)
            echo "- **Verified Active Channels (Single Link Each):** $TOTAL_CHANNELS" >> $GITHUB_STEP_SUMMARY
            echo "- **Schedule:** Runs every 24 hours ⏱️" >> $GITHUB_STEP_SUMMARY
            echo "- **Status:** Completed successfully ✅" >> $GITHUB_STEP_SUMMARY
            echo "- **Last Updated:** $(date -u)" >> $GITHUB_STEP_SUMMARY
          fi

      - name: 💾 Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # শুধুমাত্র working.m3u ফাইলে পরিবর্তন থাকলে পুশ করবে
          if git status --porcelain working.m3u | grep -q "working.m3u"; then
            git add working.m3u
            git commit -m "🚀 Auto Update: Verified working.m3u [skip ci]"
            git push
            echo "Changes pushed successfully."
          else
            echo "No changes in working.m3u. Skipping git commit."
          fi

      - name: 🧹 Delete Previous Workflow Runs
        if: success() # বর্তমান রান সাকসেসফুল হলেই কেবল পুরানোগুলো ডিলিট করবে
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Current Run ID: ${{ github.run_id }}"
          echo "Searching for completed previous runs to delete..."
          
          # পূর্বের ফিনিশড রান আইডিগুলো বের করা
          PREVIOUS_RUNS=$(gh run list --workflow=update_m3u.yml --status=completed --json databaseId --jq '.[].databaseId' || echo "")
          
          for RUN_ID in $PREVIOUS_RUNS; do
            if [ "$RUN_ID" != "${{ github.run_id }}" ]; then
              echo "🗑️ Deleting previous run ID: $RUN_ID"
              gh run delete "$RUN_ID" || true
            fi
          done
          
          echo "✅ All older workflow runs have been successfully cleaned up!"
